{% extends "base.html" %}

{% block title %}Page Not Found - Smart Kolhapur Guide{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 80px 20px;">
  <div style="font-size: 4rem; color: var(--color-primary); margin-bottom: 16px;">
    <i class="fa-solid fa-map-location-dot"></i>
  </div>
  <h1 style="font-size: 2.2rem; color: var(--color-primary-dark); margin-bottom: 10px;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 24px; font-size: 1rem;">
    The tourist attraction or hotel page you are looking for might have been moved or does not exist.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">
    <i class="fa-solid fa-house"></i> Return to Homepage
  </a>
</div>
{% endblock %}
