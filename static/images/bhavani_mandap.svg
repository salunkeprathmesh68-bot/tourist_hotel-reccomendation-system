<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#681D24" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.75)" />
      <stop offset="60%" stop-color="rgba(0,0,0,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Decorative geometric accents -->
  <circle cx="700" cy="90" r="160" fill="rgba(255,255,255,0.08)" />
  <circle cx="700" cy="90" r="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <circle cx="100" cy="400" r="180" fill="rgba(0,0,0,0.15)" />

  <!-- Central silhouette artwork -->
  <g transform="translate(340, 140)" fill="rgba(255,255,255,0.22)">
    <path d="M60 0 L120 80 L0 80 Z" />
    <rect x="20" y="80" width="80" height="70" rx="6" />
    <path d="M45 150 L45 110 L75 110 L75 150 Z" fill="rgba(0,0,0,0.3)" />
    <circle cx="60" cy="-15" r="12" fill="#F4A261" stroke="#fff" stroke-width="2" />
  </g>

  <!-- Dark gradient overlay for text readability -->
  <rect width="800" height="500" fill="url(#overlay)" />

  <!-- Kolhapur Badge -->
  <g transform="translate(48, 48)">
    <rect width="170" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="85" y="22" font-family="'Segoe UI', Poppins, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">KOLHAPUR, MH</text>
  </g>

  <!-- Title and subtitle -->
  <text x="48" y="380" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="bold" fill="#ffffff">Bhavani Mandap</text>
  <text x="48" y="420" font-family="'Segoe UI', Poppins, sans-serif" font-size="18" fill="rgba(255,255,255,0.88)">Maratha Royal Court & Wrestling</text>

  <!-- Decorative bottom gold line -->
  <rect x="48" y="445" width="90" height="4" rx="2" fill="#D4AF37" />
</svg>